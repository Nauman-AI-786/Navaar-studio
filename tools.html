{id:'pct',cat:'Utilities',n:'Percentage Calculator',d:'Percent of a number, ratio and percent change.',k:'percentage',pop:1,f:[['n','Number A',20],['n','Number B',150],['sel','Question',['A% of B','A is what % of B','% change from A to B']]],run:([a,b,m])=>{a=+a;b=+b;return m=='A% of B'?`${a}% of ${b} = ${a*b/100}`:m=='A is what % of B'?`${a} is ${(a/b*100).toFixed(2)}% of ${b}`:`Change from ${a} to ${b} = ${((b-a)/a*100).toFixed(2)}%`}},
{id:'age',cat:'Utilities',n:'Age & Date Calculator',d:'Exact age and days until your next birthday.',k:'date calculator birthday',f:[['d','Date of birth']],run:([s])=>{const b=new Date(s),n=new Date();if(!s||isNaN(b))return'Please choose a date.';let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}let x=new Date(n.getFullYear(),b.getMonth(),b.getDate());if(x<new Date(n.getFullYear(),n.getMonth(),n.getDate()))x.setFullYear(x.getFullYear()+1);return`Age: ${y} years, ${m} months, ${d} days\nTotal days lived: ${Math.floor((n-b)/864e5)}\nNext birthday in: ${Math.ceil((x-n)/864e5)} days`}},
